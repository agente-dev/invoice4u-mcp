name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Node 24 · lint · check · test · build · pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify npm tarball contents
        run: |
          npm pack --dry-run > /tmp/pack-out.txt 2>&1
          cat /tmp/pack-out.txt
          grep -q "dist/index.js" /tmp/pack-out.txt || { echo "::error::dist/index.js missing from tarball"; exit 1; }
          grep -q "README.md" /tmp/pack-out.txt || { echo "::error::README.md missing from tarball"; exit 1; }
          grep -q "LICENSE" /tmp/pack-out.txt || { echo "::error::LICENSE missing from tarball"; exit 1; }